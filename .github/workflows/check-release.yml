name: Check release
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch release version
        run: |
          curl -sL https://api.github.com/repos/sdolle1775/marvel-lcg/releases | \
          jq -r ".[0].tag_name" > latest-version.txt
      - name: Check for modified files
        id: git-check
        run: echo ::set-output name=modified::$([ -z "`git status --porcelain`" ] && echo "false" || echo "true")
      - name: Commit file
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'Github Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -am "New release version"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
      - name: Sync repo
        if: steps.git-check.outputs.modified == 'true'
        run: gh repo sync $REPOSITORY -b $BRANCH_NAME
        env:
          # PAT required to allow sync to update .github/workflow files
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
      - name: Create release
        if: steps.git-check.outputs.modified == 'true'
        run: gh release create $(cat latest-version.txt)
        env:
          # PAT required to trigger other workflows
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}